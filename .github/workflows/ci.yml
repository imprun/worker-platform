name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: ci-jobs
          POSTGRES_DB: jobs
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal examples/echo)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - name: Go unit and contract tests
        run: go test -race -skip '^(TestPostgres|TestWorkerAppPostgresHTTP)' ./...
      - name: PostgreSQL reservation, migration, and Job tests
        run: go test -race -count=1 -run '^TestPostgres' -v ./internal/jobs
        env:
          WORKER_JOB_TEST_DSN: postgres://jobs:ci-jobs@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/jobs?sslmode=disable
      - name: PostgreSQL 워커 앱 HTTP 테스트
        run: go test -race -count=1 -run '^TestWorkerAppPostgresHTTP$' -v ./internal/workerapps
        env:
          WORKER_APP_TEST_DSN: postgres://jobs:ci-jobs@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/jobs?sslmode=disable
      - name: ATE 실행 조건과 OpenAPI 검증 시나리오 검사
        run: python3 -B -m unittest scripts/test_ate_integration.py scripts/test_worker_app_integration.py
      - name: Render the direct ATE example
        run: go run ./cmd/workerctl render -f examples/echo/ate-worker.yaml -profile examples/echo/ate-profile.yaml > "$RUNNER_TEMP/echo-ate-plan.txt"
      - name: Check the controller image
        run: |
          docker buildx build --load --file Dockerfile.controller --tag worker-platform-controller:ci .
          docker run --rm worker-platform-controller:ci -h
      - name: Check the Run API image
        run: |
          docker buildx build --load --file Dockerfile.run-api --tag worker-platform-run-api:ci .
          docker run --rm worker-platform-run-api:ci -h
      - name: Build the actor runtime and Echo app package
        run: |
          go build -trimpath -ldflags '-X main.version=ate-smoke-ci' -o "$RUNNER_TEMP/echo-app" ./examples/echo/app
          "$RUNNER_TEMP/echo-app" --check
          response=$(printf '%s' '{"input":{"message":"hello"}}' | "$RUNNER_TEMP/echo-app")
          test "$response" = '{"message":"hello","version":"ate-smoke-ci"}'
          package_digest=$(python3 scripts/build-app-package.py "$RUNNER_TEMP/echo-app" "$RUNNER_TEMP/echo-package")
          runtime_image=registry.example.test/workers/actor-runtime@sha256:1111111111111111111111111111111111111111111111111111111111111111
          app_package="packages.example.test:8443/workers/echo@$package_digest"
          python3 examples/echo/packaged_smoke.py "$RUNNER_TEMP" "$runtime_image" "$app_package"
          go run ./cmd/workerctl render -f "$RUNNER_TEMP/worker.yaml" -profile "$RUNNER_TEMP/profile.yaml" -output template |
            jq -e --arg image "$runtime_image" --arg package "$app_package" \
              '.containers[0] | .image == $image and any(.env[]; .name == "WORKER_APP_PACKAGE" and .value == $package)'
          docker buildx build --load --file Dockerfile.actor-runtime --tag worker-platform-runtime:ci .
          docker run --rm worker-platform-runtime:ci -h
      - name: Check the Echo image and example script
        run: |
          sh -n examples/echo/run.sh
          sh -n examples/echo/build-verification-packages.sh
          docker buildx build --load --file Dockerfile.echo --tag worker-platform-echo:ci .
          container=$(docker run --detach --rm --publish 127.0.0.1::80 worker-platform-echo:ci)
          trap 'docker stop "$container" >/dev/null' EXIT
          address=$(docker port "$container" 80/tcp)
          curl -fsS --retry 5 --retry-connrefused --max-time 5 "http://$address/readyz"
          response=$(curl -fsS --max-time 5 -H 'Content-Type: application/json' \
            --data '{"message":"echo-example"}' "http://$address/invoke")
          test "$response" = '{"message":"echo-example"}'
