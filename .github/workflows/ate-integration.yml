name: ATE integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the integration change check
        required: true
        type: string
      api_sha:
        description: API Platform 제품 검증에 사용할 전체 SHA
        required: false
        type: string
      build_worker_artifacts:
        description: 현재 Worker Platform main의 ARM64 검증 후보 빌드
        default: false
        type: boolean

permissions:
  contents: read

env:
  BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base || github.event.before }}

jobs:
  changes:
    name: Detect ATE integration changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 수동 워커 앱 검증 요청 확인
        if: github.event_name == 'workflow_dispatch' && inputs.api_sha != ''
        env:
          PRODUCT_ATE_ENABLED: ${{ vars.ATE_INTEGRATION_ENABLED == 'true' }}
          PRODUCT_API_SHA: ${{ inputs.api_sha }}
        run: python3 scripts/worker_app_integration.py --check-dispatch "$GITHUB_SHA" "$PRODUCT_API_SHA"
      - id: scope
        run: python3 scripts/ate_integration.py "$BASE_REF" "$GITHUB_SHA"

  smoke:
    name: Live ATE smoke
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.required == 'true' && vars.ATE_INTEGRATION_ENABLED == 'true'
    runs-on: [self-hosted, linux, ate-integration]
    timeout-minutes: 15
    concurrency:
      group: worker-platform-ate-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: python3 scripts/ate_integration.py --run "$BASE_REF" "$GITHUB_SHA"

  worker-artifacts:
    name: 워커 앱 ARM64 검증 후보 빌드
    needs: changes
    if: >-
      github.repository == 'imprun/worker-platform' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.required == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_worker_artifacts))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: OCI 이미지와 Echo 패키지 빌드
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/worker-app-oci"
          mkdir "$out"

          build_image() {
            docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
              --file "$1" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --output "type=oci,dest=$out/$2.oci.tar" .
          }
          build_image Dockerfile.run-api run-api
          build_image Dockerfile.controller worker-controller
          build_image Dockerfile.actor-runtime actor-runtime
          sh examples/echo/build-verification-packages.sh --layout-only "$out/packages" > "$out/packages.txt"

          printf '%s\n' "$GITHUB_SHA" > "$out/source-revision.txt"
          python3 scripts/verify-worker-oci.py "$out" "$GITHUB_SHA" > "$out/images.txt"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          {
            printf '## 워커 앱 ARM64 검증 후보\n\n'
            printf '소스 커밋 `%s`\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat "$out/images.txt" "$out/packages.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-app-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-app-oci
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  worker-app-product:
    name: 워커 앱 개발 Gateway 검증
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ATE_INTEGRATION_ENABLED == 'true' &&
      ((needs.changes.outputs.required == 'true' && vars.ATE_PRODUCT_API_SHA != '') ||
        (github.event_name == 'workflow_dispatch' && inputs.api_sha != ''))
    runs-on:
      group: imprun-oci-builds
      labels: arc-runner-set-imprun
    timeout-minutes: 30
    concurrency:
      group: worker-platform-ate-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 인증된 Gateway 왕복과 리비전 전환 검증
        env:
          PRODUCT_API_SHA: ${{ inputs.api_sha || vars.ATE_PRODUCT_API_SHA }}
        run: python3 scripts/worker_app_integration.py "$GITHUB_SHA" "$PRODUCT_API_SHA"
