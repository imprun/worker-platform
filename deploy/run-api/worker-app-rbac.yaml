apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-app-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-app-api
rules:
  - apiGroups: [workerplatform.imprun.dev]
    resources: [httpworkers]
    verbs: [get, create, update]
  - apiGroups: [workerplatform.imprun.dev]
    resources: [workerprofiles]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-app-api
subjects:
  - kind: ServiceAccount
    name: worker-app-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-app-api
