apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: run-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: run-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.test/workers/run-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args:
            - -job-listen=:8084
            - -job-dsn-file=/etc/jobs/dsn
            - -job-token-file=/etc/jobs/token
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: jobs
              mountPath: /etc/jobs
              readOnly: true
      volumes:
        - name: jobs
          secret:
            secretName: worker-job-credentials
            items:
              - key: dsn
                path: dsn
              - key: token
                path: token
