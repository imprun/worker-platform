apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerprofiles.workerplatform.imprun.dev
spec:
  group: workerplatform.imprun.dev
  scope: Namespaced
  names:
    plural: workerprofiles
    singular: workerprofile
    kind: WorkerProfile
    listKind: WorkerProfileList
  versions:
    - name: v1alpha3
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [atespace, workerPool, poolID, architecture, sandboxClass, cpu, memory]
              properties:
                atespace:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                workerPool:
                  type: object
                  required: [name, namespace]
                  properties:
                    name:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    namespace:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                poolID:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                architecture:
                  type: string
                  enum: [arm64, amd64]
                sandboxClass:
                  type: string
                  enum: [gvisor]
                cpu:
                  type: string
                  pattern: '^[1-9][0-9]{0,7}m?$'
                memory:
                  type: string
                  pattern: '^[1-9][0-9]{0,7}(Mi|Gi)$'
                runtimeImage:
                  type: string
                  maxLength: 512
                  pattern: '^[a-z0-9][a-z0-9./_-]*(:[0-9]+)?/[a-z0-9][a-z0-9./_-]*@sha256:[a-f0-9]{64}$'
                appRegistryCA:
                  type: string
                  maxLength: 32768
                  description: Optional public PEM trust bundle for the HTTPS app registry.
                egress:
                  type: array
                  maxItems: 256
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [protocol, hostname, port]
                    properties:
                      protocol: {type: string, enum: [http, tlsPassthrough]}
                      hostname:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: '^[a-z0-9.-]+$'
                      port: {type: integer, format: int32, minimum: 1, maximum: 65535}
