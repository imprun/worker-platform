apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httpworkers.workerplatform.imprun.dev
spec:
  group: workerplatform.imprun.dev
  scope: Namespaced
  names:
    plural: httpworkers
    singular: httpworker
    kind: HTTPWorker
    listKind: HTTPWorkerList
  versions:
    - name: v1alpha3
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Actor
          type: string
          jsonPath: .status.active.actor
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [profile, image, trigger]
              properties:
                profile:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                image:
                  type: string
                  maxLength: 512
                  pattern: '^[a-z0-9][a-z0-9./_-]*(:[0-9]+)?/[a-z0-9][a-z0-9./_-]*@sha256:[a-f0-9]{64}$'
                trigger:
                  type: object
                  required: [hostname, path, gateway, router]
                  properties:
                    hostname:
                      type: string
                      minLength: 3
                      maxLength: 253
                      pattern: '^[a-z0-9.-]+\.[a-z0-9.-]+$'
                    path:
                      type: string
                      maxLength: 253
                      pattern: '^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$'
                      x-kubernetes-validations:
                        - rule: "!(self in ['/healthz', '/readyz', '/attempt'])"
                          message: This path is reserved.
                    gateway:
                      type: object
                      required: [name, namespace, sectionName]
                      properties:
                        name:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                        namespace:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                        sectionName:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                    router:
                      type: object
                      required: [name, namespace, port]
                      properties:
                        name:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                        namespace:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
            status:
              type: object
              required: [observedGeneration, conditions]
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                observedProfile:
                  type: object
                  required: [name, uid, generation]
                  properties:
                    name: {type: string}
                    uid: {type: string}
                    generation: {type: integer, format: int64}
                active:
                  type: object
                  required: [generation, profile, revision, atespace, actor, actorUID, worker, workerPod, route]
                  properties:
                    generation: {type: integer, format: int64}
                    profile:
                      type: object
                      required: [name, uid, generation]
                      properties:
                        name: {type: string}
                        uid: {type: string}
                        generation: {type: integer, format: int64}
                    revision: {type: string}
                    atespace: {type: string}
                    actor: {type: string}
                    actorUID: {type: string}
                    worker: {type: string}
                    workerPod: {type: string}
                    route: {type: string}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, observedGeneration, lastTransitionTime, reason, message]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
