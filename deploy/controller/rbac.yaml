apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-controller
rules:
  - apiGroups: [workerplatform.imprun.dev]
    resources: [httpworkers, workerprofiles]
    verbs: [get, list, watch]
  - apiGroups: [workerplatform.imprun.dev]
    resources: [httpworkers/status]
    verbs: [update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, create, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-controller
subjects:
  - kind: ServiceAccount
    name: worker-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-controller
