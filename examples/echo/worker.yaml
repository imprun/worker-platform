apiVersion: workerplatform.imprun.dev/v1alpha1
kind: HTTPWorker
metadata:
  name: echo
  namespace: workers
spec:
  atespace: workers
  image: registry.example.test/workers/echo@sha256:1111111111111111111111111111111111111111111111111111111111111111
  cpu: 100m
  memory: 64Mi
  trigger:
    hostname: echo.example.test
    path: /invoke
    gateway:
      name: workers
      namespace: workers
      sectionName: http
    router:
      name: atenet-router
      namespace: ate-system
      port: 443
