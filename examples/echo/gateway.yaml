apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: echo-cluster-ip
  namespace: wp-echo-example
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: echo
  namespace: wp-echo-example
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: echo-cluster-ip
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: router-client
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: echo.example.test
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: wp-echo-example-router
  namespace: ate-system
spec:
  selector:
    app: atenet-router
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: wp-echo-example-router
  namespace: ate-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: wp-echo-example-router
      sectionName: https
  validation:
    hostname: atenet-router.ate-system.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: wp-echo-example-router
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: wp-echo-example-router
  namespace: ate-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: wp-echo-example
  to:
    - group: ""
      kind: Service
      name: wp-echo-example-router
