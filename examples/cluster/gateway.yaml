# Example for an operator-owned development ATE Router. Substitute your class and certificate references.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workers
  namespace: workers
spec:
  gatewayClassName: YOUR_GATEWAY_CLASS
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: ate-router-client
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: echo.example.test
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: worker-platform-router-tls
  namespace: ate-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: atenet-router
  validation:
    hostname: atenet-router.ate-system.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ate-router-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: worker-platform-router
  namespace: ate-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: workers
  to:
    - group: ""
      kind: Service
      name: atenet-router
